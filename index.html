<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRUCTURED — 만족도조사 통합 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    :root {
      --color-carbon: #1e293b; --color-paper-white: #ffffff; --color-sky-wash: #f1f5f9;
      --color-concrete-gray: #e2e8f0; --color-electric-blue: #3b82f6; --color-mint-pop: #10b981;
      --font-display: 'Plus Jakarta Sans', sans-serif; --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    body { background-color: #f8fafc; color: #0f172a; font-family: var(--font-body); margin: 0; padding: 0; }
    .font-display { font-family: var(--font-display); }
    .pop-card { background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .btn-pill { background-color: #0f172a; color: #ffffff; border-radius: 9999px; padding: 9px 20px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: none; }
    .btn-pill:hover { background-color: #334155; }
    .btn-outline-pill { background-color: #ffffff; border: 1px solid #cbd5e1; color: #334155; border-radius: 9999px; padding: 8px 18px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-outline-pill:hover { background-color: #f1f5f9; }
    .sticker-badge { border: 1px solid #cbd5e1; border-radius: 9999px; padding: 3px 10px; font-size: 11px; font-weight: 700; display: inline-block; background-color: #f8fafc; color: #334155; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = "https://esgdllfikkftpplurack.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_VogyRwM2Rwch2C7kWBDeuQ_eXgiX9D0";
    
    let supabase = null;
    try {
      if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase init error:", e);
    }

    const STORAGE_KEY_PROJECTS = 'STRUCTURED_PROJECTS_V1';
    const STORAGE_KEY_RESPONSES = 'STRUCTURED_RESPONSES_V2';
    const STORAGE_KEY_USERS = 'STRUCTURED_USERS_V1';

    const todayISO = () => new Date().toISOString().slice(0, 10);
    const responseAnswer = (response, question) => {
      if (response?.answers && Object.prototype.hasOwnProperty.call(response.answers, question.id)) return response.answers[question.id];
      return response?.[question.id];
    };
    const csvEscape = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
    const downloadBlob = (blob, filename) => {
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    const exportProjectCSV = (project, responses) => {
      const headers = ['응답ID', '수집출처', '응답일시', ...((project.questions || []).map((q, i) => `Q${i + 1}. ${q.text}`))];
      const rows = responses.map(r => [r.id, r.source, r.date, ...(project.questions || []).map(q => responseAnswer(r, q))]);
      const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
      downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), `${project.title || 'survey'}_responses.csv`);
    };

    const persistResponse = async (projectId, response) => {
      if (!supabase) return { ok: true, localOnly: true };
      const { id, source, date, answers, ...legacyFields } = response;
      const payload = { ...(answers ? { answers } : {}), ...legacyFields, date };
      const { error } = await supabase.from('structured_responses').insert([{ id, project_id: projectId, source: source || '온라인', data: payload }]);
      if (error) {
        console.error("Supabase insert error details:", error);
        return { ok: false, error };
      }
      return { ok: true };
    };

    const INITIAL_USERS = [
      { id: 'user-admin', username: 'admin', password: '1130', name: '최고관리자', org: '총괄관리팀', role: 'admin', status: 'approved' },
      { id: 'user-sub', username: 'subadmin', password: '1130', name: '김부관', org: '운영지원팀', role: 'sub_admin', status: 'approved' }
    ];

    const INITIAL_PROJECTS = [
      {
        id: 'proj-1', ownerId: 'user-admin', title: '2026년 노인복지관 이용자 만족도 조사', target: '복지관 이용 어르신 (200명)', period: '2026-10-01 ~ 2026-10-31', status: '배포 중', createdAt: '2026-09-25',
        questions: [
          { id: 'q1', type: 'scale5', text: '시설 이용 시 전반적인 청결도에 만족하십니까?', category: '시설', scaleLabels: ['1점', '2점', '3점', '4점', '5점'] },
          { id: 'q2', type: 'scale5', text: '직원들의 응대 태도는 친절합니까?', category: '서비스', scaleLabels: ['1점', '2점', '3점', '4점', '5점'] }
        ]
      }
    ];

    const INITIAL_RESPONSES = {};

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [isRegister, setIsRegister] = useState(false);
      const [username, setUsername] = useState('admin');
      const [password, setPassword] = useState('1130');
      const [name, setName] = useState('');
      const [org, setOrg] = useState('');

      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_USERS);
        return saved ? JSON.parse(saved) : INITIAL_USERS;
      });

      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_PROJECTS);
        return saved ? JSON.parse(saved) : INITIAL_PROJECTS;
      });

      const [responsesMap, setResponsesMap] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_RESPONSES);
        return saved ? JSON.parse(saved) : INITIAL_RESPONSES;
      });

      const [currentView, setCurrentView] = useState('dashboard');
      const [activeProjectId, setActiveProjectId] = useState(INITIAL_PROJECTS[0]?.id || 'proj-1');
      const [showSurveyModal, setShowSurveyModal] = useState(false);
      const [publicSurveyMode, setPublicSurveyMode] = useState(false);
      const [publicSurveySubmitted, setPublicSurveySubmitted] = useState(false);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const respondProjId = urlParams.get('respond');
        if (respondProjId) {
          setActiveProjectId(respondProjId);
          setPublicSurveyMode(true);
        }
      }, []);

      useEffect(() => { localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users)); }, [users]);
      useEffect(() => { localStorage.setItem(STORAGE_KEY_PROJECTS, JSON.stringify(projects)); }, [projects]);
      useEffect(() => { localStorage.setItem(STORAGE_KEY_RESPONSES, JSON.stringify(responsesMap)); }, [responsesMap]);

      useEffect(() => {
        if (!supabase) return;
        const fetchSupabaseData = async () => {
          try {
            const { data: dbUsers, error: userErr } = await supabase.from('users').select('*');
            if (!userErr && dbUsers && dbUsers.length > 0) setUsers(dbUsers);

            const { data: dbProjects, error: projErr } = await supabase.from('projects').select('*');
            if (!projErr && dbProjects && dbProjects.length > 0) {
              setProjects(dbProjects.map(p => ({
                id: p.id, ownerId: p.owner_id, title: p.title, target: p.target, period: p.period, status: p.status,
                createdAt: p.created_at?.split('T')[0] || '2026-10-01', questions: p.questions
              })));
            }

            const { data: dbResponses, error: respErr } = await supabase.from('structured_responses').select('*');
            if (!respErr && dbResponses) {
              const map = {};
              dbResponses.forEach(r => {
                if (!map[r.project_id]) map[r.project_id] = [];
                map[r.project_id].push({
                  id: r.id, source: r.source, ...r.data,
                  date: r.created_at?.split('T')[0] || '2026-10-29'
                });
              });
              setResponsesMap(map);
            }
          } catch (err) {
            console.error("Supabase sync error:", err);
          }
        };
        fetchSupabaseData();
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (isRegister) {
          if (!username || !password || !name || !org) { alert('모든 가입 정보를 입력해주세요.'); return; }
          const newUser = { id: `user-${Date.now()}`, username, password, name, org, role: 'user', status: 'pending' };
          setUsers(prev => [...prev, newUser]);
          if (supabase) await supabase.from('users').insert([newUser]);
          alert('가입 신청이 완료되었습니다.'); setIsRegister(false); setPassword('');
        } else {
          const user = users.find(u => u.username === username && u.password === password);
          if (!user) { alert('아이디 또는 비밀번호가 일치하지 않습니다.'); return; }
          if (user.status !== 'approved') { alert('승인 대기 중인 계정입니다.'); return; }
          setCurrentUser(user);
        }
      };

      const handleAddResponse = async (targetProjId, newResponseObj) => {
        const responseToSave = { ...newResponseObj, date: newResponseObj.date || todayISO() };
        if (supabase) {
          const result = await persistResponse(targetProjId, responseToSave);
          if (!result.ok) { alert('응답 저장 실패: ' + (result.error?.message || '알 수 없는 오류')); return; }
        }
        setResponsesMap(prev => ({ ...prev, [targetProjId]: [...(prev[targetProjId] || []), responseToSave] }));
        setShowSurveyModal(false);
        if (publicSurveyMode) setPublicSurveySubmitted(true);
        else alert('설문 응답이 성공적으로 저장되었습니다!');
      };

      const activeProject = useMemo(() => projects.find(p => p.id === activeProjectId) || projects[0], [projects, activeProjectId]);
      const currentResponses = useMemo(() => responsesMap[activeProjectId] || [], [responsesMap, activeProjectId]);

      if (publicSurveyMode) {
        if (publicSurveySubmitted) return <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6"><div className="pop-card bg-white p-10 max-w-xl w-full text-center"><h1 className="text-2xl font-bold mb-3">응답이 제출되었습니다</h1><p className="text-slate-600 text-sm">참여해 주셔서 감사합니다.</p></div></div>;
        if (!activeProject) return <div className="min-h-screen flex items-center justify-center p-6"><div className="pop-card bg-white p-8">설문을 찾을 수 없습니다.</div></div>;
        return <div className="min-h-screen bg-slate-100 p-4 md:p-8"><div className="max-w-3xl mx-auto pop-card bg-white p-6 md:p-10"><h1 className="text-2xl font-bold mb-4">{activeProject.title}</h1><SurveyFillForm project={activeProject} onSubmitResponse={(r) => handleAddResponse(activeProject.id, r)} onClose={null} /></div></div>;
      }

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6">
            <div className="pop-card bg-white p-8 max-w-md w-full">
              <h1 className="text-2xl font-bold mb-4 text-center">Structured 로그인</h1>
              <form onSubmit={handleSubmit} className="space-y-4 text-xs font-medium">
                <div><label className="block mb-1 font-bold">아이디</label><input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full border p-2 rounded" /></div>
                <div><label className="block mb-1 font-bold">비밀번호</label><input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border p-2 rounded" /></div>
                <button type="submit" className="btn-pill w-full justify-center py-2.5">로그인하기</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-100 pb-20">
          <header className="bg-white border-b sticky top-0 z-40 px-8 h-16 flex items-center justify-between">
            <div className="font-bold text-lg">STRUCTURED 만족도조사 시스템</div>
            <div className="flex gap-2 text-xs">
              <button onClick={() => setCurrentView('dashboard')} className="btn-outline-pill">프로젝트</button>
              <button onClick={() => setCurrentView('responses')} className="btn-outline-pill">응답데이터</button>
              <button onClick={() => setCurrentUser(null)} className="btn-pill">로그아웃</button>
            </div>
          </header>
          <main className="max-w-7xl mx-auto px-8 pt-8">
            {currentView === 'dashboard' && <DashboardView projects={projects} setProjects={setProjects} setActiveProjectId={setActiveProjectId} setCurrentView={setCurrentView} currentUser={currentUser} />}
            {currentView === 'builder' && <BuilderView project={activeProject} setProjects={setProjects} onOpenSurveyModal={() => setShowSurveyModal(true)} />}
            {currentView === 'responses' && <ResponsesView project={activeProject} responsesList={currentResponses} setResponsesMap={setResponsesMap} />}
            {currentView === 'analytics' && <AnalyticsView project={activeProject} responsesList={currentResponses} />}
            {currentView === 'report' && <ReportView project={activeProject} responsesList={currentResponses} />}
          </main>
          {showSurveyModal && activeProject && <SurveyFillModal project={activeProject} onClose={() => setShowSurveyModal(false)} onSubmitResponse={(r) => handleAddResponse(activeProject.id, r)} />}
        </div>
      );
    }

    function DashboardView({ projects, setProjects, setActiveProjectId, setCurrentView, currentUser }) {
      return (
        <div>
          <h1 className="text-2xl font-bold mb-4">조사 프로젝트 목록</h1>
          <div className="grid grid-cols-2 gap-4">
            {projects.map(proj => (
              <div key={proj.id} className="pop-card p-5 bg-white">
                <h3 className="font-bold text-lg mb-2">{proj.title}</h3>
                <div className="flex gap-2 mt-4">
                  <button onClick={() => { setActiveProjectId(proj.id); setCurrentView('builder'); }} className="btn-outline-pill text-xs">설계</button>
                  <button onClick={() => { setActiveProjectId(proj.id); setCurrentView('responses'); }} className="btn-outline-pill text-xs">응답보기</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function BuilderView({ project, setProjects, onOpenSurveyModal }) {
      const surveyUrl = `${window.location.origin}${window.location.pathname}?respond=${project.id}`;
      return (
        <div className="pop-card p-6 bg-white">
          <h2 className="text-xl font-bold mb-2">{project.title} — 에디터</h2>
          <div className="p-3 bg-blue-50 border rounded mb-4 text-xs font-mono">설문 링크: {surveyUrl}</div>
          <button onClick={onOpenSurveyModal} className="btn-pill text-xs">실제 설문 응답 테스트하기</button>
        </div>
      );
    }

    function SurveyFillForm({ project, onSubmitResponse, onClose }) {
      const [answers, setAnswers] = useState({});
      const [submitting, setSubmitting] = useState(false);
      const setAnswer = (id, val) => setAnswers(prev => ({ ...prev, [id]: val }));
      const handleSubmit = async (e) => {
        e.preventDefault();
        const response = { id: `resp-${Date.now()}`, source: '온라인', date: todayISO(), answers };
        setSubmitting(true);
        try { await onSubmitResponse(response); } finally { setSubmitting(false); }
      };
      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          {(project.questions || []).map((q, idx) => (
            <div key={q.id} className="p-3 bg-slate-50 border rounded">
              <p className="font-bold mb-2">Q{idx+1}. {q.text}</p>
              <div className="grid grid-cols-5 gap-1">
                {(q.scaleLabels || ['1점','2점','3점','4점','5점']).map((lbl, i) => (
                  <button type="button" key={i} onClick={() => setAnswer(q.id, i+1)} className={`p-2 border rounded ${answers[q.id] === i+1 ? 'bg-slate-900 text-white' : 'bg-white'}`}>{lbl}</button>
                ))}
              </div>
            </div>
          ))}
          <div className="flex justify-end gap-2">
            {onClose && <button type="button" onClick={onClose} className="btn-outline-pill">닫기</button>}
            <button type="submit" disabled={submitting} className="btn-pill">{submitting ? '제출 중...' : '제출하기'}</button>
          </div>
        </form>
      );
    }

    function SurveyFillModal({ project, onClose, onSubmitResponse }) {
      return (
        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
          <div className="pop-card bg-white p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <h2 className="text-lg font-bold mb-4">{project.title} 테스트</h2>
            <SurveyFillForm project={project} onSubmitResponse={onSubmitResponse} onClose={onClose} />
          </div>
        </div>
      );
    }

    function ResponsesView({ project, responsesList }) {
      return (
        <div className="pop-card p-6 bg-white">
          <h2 className="text-xl font-bold mb-4">응답 데이터 목록 ({responsesList.length}건)</h2>
          <table className="w-full text-xs border-collapse">
            <thead><tr className="bg-slate-100 border-b"><th className="p-2 text-left">ID</th><th className="p-2 text-left">출처</th><th className="p-2 text-left">응답일시</th></tr></thead>
            <tbody>
              {responsesList.map(r => (
                <tr key={r.id} className="border-b"><td className="p-2">{r.id}</td><td className="p-2">{r.source}</td><td className="p-2">{r.date}</td></tr>
              ))}
            </tbody>
          </table>
          {!responsesList.length && <p className="text-xs text-slate-400 mt-4">수집된 응답이 없습니다.</p>}
        </div>
      );
    }

    function AnalyticsView({ project, responsesList }) { return <div className="pop-card p-6 bg-white">통계 화면 ({responsesList.length}건)</div>; }
    function ReportView({ project, responsesList }) { return <div className="pop-card p-6 bg-white">보고서 화면 ({responsesList.length}건)</div>; }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
